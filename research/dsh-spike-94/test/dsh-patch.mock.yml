# Test-only overlay: points the openrouter route at the local mock LLM.
# Used by test/e2e-mock.sh; not part of the real run (dsh-patch.yml).
- insert:
    - id: golos-qa
      name: ../plugins/golos-qa/index.js
      config: {}
- id: agent-default-model
  config:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
        baseURL: http://127.0.0.1:8301/v1
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
