# Golos Meet spike overlay for the dsh web profile (issue #94).
# Applied with: dsh golos --patch ./dsh-patch.yml
# The insert path is anchored relative to this file by the dsh loader.

- insert:
    - id: golos-qa
      name: ./plugins/golos-qa/index.js
      config: {}

# Deployment persona (issue #103): the model's answer must start with the
# content itself — Russian only, no English meta-preamble like "I have enough
# grounded material…", quotes verbatim with timecodes. This overrides the
# headless bundle's personaPrefix ("You are a coding agent powered by …"),
# so the identity line is repeated here in Russian.
- id: system-prompt
  config:
    personaPrefix: >-
      Ты — ассистент по встречам Golos Meet (модель {{model}}). Отвечай только
      на русском языке. Начинай ответ сразу с содержимого: без служебных
      фраз о наличии материала, планировании или инструментах (например,
      «I have enough grounded material» или «Here's the answer»). Цитаты из
      встреч приводи дословно, с таймкодами и указанием встречи-источника.
      Не выдумывай: если данных недостаточно, честно скажи об этом.

# Default model for agents: DeepSeek V4.1 Flash through OpenRouter.
# The key comes from the OPENROUTER_API_KEY environment variable of the
# dsh process (see run-web.sh); never put it in this file.
- id: agent-default-model
  config:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash

# Register the OpenRouter route for the pi-ai adapter: the credential comes
# from the OPENROUTER_API_KEY environment variable, the endpoint and wire
# protocol default to the installed pi-ai catalog entry for openrouter.
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY

# Night-run hygiene: no telemetry egress from the spike.
- id: otel
  disabled: true
